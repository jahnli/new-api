# Requires a Windows amd64 Shell executor (PowerShell) tagged "windows".
# Install Go matching go.mod, Node.js 22 + npm, Git, and MinGW-w64 GCC on PATH.
# Frontend assets are produced by the Linux job; no Bun install is needed here.
electron-windows:
  stage: package
  tags:
    - windows
  rules:
    - if: '$TASK_TYPE == "electron-build"'
  needs:
    - build-frontend
  script:
    - "& ./.gitlab/scripts/build-windows.ps1 -Target electron"
  artifacts:
    paths:
      - release-assets/
    expire_in: 30 days

publish-electron:
  extends: .publish-release
  rules:
    - if: '$TASK_TYPE == "electron-build" && $CI_COMMIT_TAG'
  needs:
    - electron-windows
