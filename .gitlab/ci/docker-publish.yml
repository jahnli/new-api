# Docker executor config.toml requirements:
#   [runners.docker]
#     privileged = true
#     volumes = ["/certs/client", "/cache"]
# CI/CD variables: DOCKER_USERNAME, DOCKER_TOKEN, MODEL_SQUARE_AES_KEY.
# Protected variables require a protected branch/tag.
.docker-publish:
  extends: .linux-container
  stage: publish
  image: docker:29.10.0-cli
  services:
    - name: docker:29.10.0-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  needs:
    - prepare-version
  resource_group: docker-hub-publish
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    BUILD_PLATFORMS: linux/amd64
  before_script:
    - |
      : "${DOCKER_USERNAME:?Set DOCKER_USERNAME in GitLab CI/CD variables}"
      : "${DOCKER_TOKEN:?Set DOCKER_TOKEN in GitLab CI/CD variables}"
    - docker info
    - printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - sh .gitlab/scripts/docker-publish.sh

docker-publish:
  extends: .docker-publish
  rules:
    - if: '$TASK_TYPE == "docker-publish"'
