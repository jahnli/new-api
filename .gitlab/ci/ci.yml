# Repository policy permits static checks and builds; no tests are run here.
check-backend:
  extends: .linux-container
  tags:
    - public
  stage: check
  image: golang:1.26.10-bookworm
  rules:
    - if: '$TASK_TYPE == "ci"'
  script:
    - mkdir -p web/dist
    - touch web/dist/index.html
    - |
      for module in . relaykit tokenkit; do
        (cd "$module" && go vet ./... && GOWORK=off go build ./...)
      done

check-frontend:
  extends: .linux-container
  tags:
    - public
  stage: check
  image: oven/bun:1.4.4
  rules:
    - if: '$TASK_TYPE == "ci"'
  script:
    - cd web
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run lint
    - bun run build
