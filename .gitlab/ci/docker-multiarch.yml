# BuildKit's bundled QEMU runs arm64 stages on the amd64 Docker runner.
# This publishes a combined manifest using the Docker Hub credentials above.
# GitHub's OIDC/cosign identity is not available on this self-managed GitLab;
# this job does not claim to reproduce the GitHub signing/attestation workflow.
docker-multiarch:
  extends: .docker-publish
  rules:
    - if: '$TASK_TYPE == "docker-multiarch"'
  variables:
    BUILD_PLATFORMS: linux/amd64,linux/arm64
