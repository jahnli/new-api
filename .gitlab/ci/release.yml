release-linux:
  extends: .linux-container
  stage: package
  image: golang:1.26.10-bookworm
  rules:
    - if: '$TASK_TYPE == "release"'
  needs:
    - build-frontend
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
  script:
    - sh .gitlab/scripts/build-release.sh linux
  artifacts:
    paths:
      - release-assets/
    expire_in: 30 days

# Requires a macOS Shell executor tagged "macos", Go matching go.mod, Git,
# and Xcode Command Line Tools. Output uses the runner's native CPU architecture.
release-macos:
  stage: package
  tags:
    - macos
  rules:
    - if: '$TASK_TYPE == "release"'
  needs:
    - build-frontend
  script:
    - sh .gitlab/scripts/build-release.sh macos
  artifacts:
    paths:
      - release-assets/
    expire_in: 30 days

# Windows amd64 Shell executor (PowerShell), Go, Git and MinGW-w64 GCC on PATH.
release-windows:
  stage: package
  tags:
    - windows
  rules:
    - if: '$TASK_TYPE == "release"'
  needs:
    - build-frontend
  script:
    - "& ./.gitlab/scripts/build-windows.ps1 -Target release"
  artifacts:
    paths:
      - release-assets/
    expire_in: 30 days

publish-release:
  extends: .publish-release
  rules:
    - if: '$TASK_TYPE == "release" && $CI_COMMIT_TAG'
  needs:
    - release-linux
    - release-macos
    - release-windows
