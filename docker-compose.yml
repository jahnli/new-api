version: "3.4"

services:
  ai-gateway:
    image: jahnlis/ai-gateway:latest
    container_name: ai-gateway
    restart: always
    command: --log-dir /app/logs
    ports:
      - "0.0.0.0:3002:3002"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - IMAGE_STUDIO_STORAGE_DIR=/data/image-studio
      - PORT=3002
      - NODE_NAME=ai-gateway-node-1
      - SQL_DSN=${SQL_DSN}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_SUPPORT_OPEN_ID=${FEISHU_SUPPORT_OPEN_ID}
      - MODEL_SQUARE_AES_KEY=${MODEL_SQUARE_AES_KEY}
      - DATA_OVERVIEW_ACTIVE_USER_REQUEST_THRESHOLD=${DATA_OVERVIEW_ACTIVE_USER_REQUEST_THRESHOLD:-10}
      - DATA_OVERVIEW_MODEL_MAPPING=${DATA_OVERVIEW_MODEL_MAPPING:-}
      - DATA_OVERVIEW_MODEL_SERIES_KEYWORDS=${DATA_OVERVIEW_MODEL_SERIES_KEYWORDS:-}
      - IMAGE_STUDIO_S3_DSN=${IMAGE_STUDIO_S3_DSN:-}
    #      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
    #      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
    #      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
    #      - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP
    #      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径
    #      - TRUSTED_PROXIES=172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警；none 不信任任何代理；显式列表替代默认值
    #      - USER_SESSION_ACTIVE_LIMIT=50
    #      - USER_SESSION_ISSUANCE_LIMIT=100
    #      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期
    #      - USER_SESSION_REVOKED_RETENTION_DAYS=7
    #      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝
    #      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
    #      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
    #      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
    #      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)
    networks:
      - 1panel-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3002/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  1panel-network:
    external: true
