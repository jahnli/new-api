# Select a task on GitLab's New pipeline page. Pushes do not publish anything.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  TASK_TYPE:
    value: ci
    options:
      - ci
      - docker-publish
      - docker-multiarch
      - electron-build
      - release
    description: "ci: code checks; docker-publish: amd64 image; docker-multiarch: amd64/arm64 images; electron-build: Windows desktop; release: Linux/macOS/Windows binaries"
  GIT_DEPTH: "0"
  GOWORK: "off"

stages:
  - prepare
  - check
  - build
  - package
  - publish

# Includes are unconditional: TASK_TYPE defaults are evaluated by job rules.
include:
  - local: /.gitlab/ci/common.yml
  - local: /.gitlab/ci/ci.yml
  - local: /.gitlab/ci/docker-publish.yml
  - local: /.gitlab/ci/docker-multiarch.yml
  - local: /.gitlab/ci/electron-build.yml
  - local: /.gitlab/ci/release.yml
